services:
  - type: web
    name: contact-book-backend
    env: python
    rootDir: Backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contact-book-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: contact-book-db
    databaseName: contactbook
    user: contactbook_user
